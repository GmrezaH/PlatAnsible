- name: Add kernel modules and make sure it is loaded after reboots
  community.general.modprobe:
    name: "{{ item.name }}"
    state: "{{ item.state | default(omit) }}"
    params: "{{ item.params | default(omit) }}"
    persistent: "{{ item.persistent | default(omit) }}"
  loop: "{{ kernel_modules }}"
  tags:
    - modules

---

- name: Firewalld | Apply firewalld rules for sshd
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    zone: "public"
    permanent: "true"
    state: "enabled"
    immediate: "true"
  loop: "{{ ssh_server_ports }}"
  tags:
    - sshd

- name: Firewalld | Apply custom firewalld rules
  ansible.posix.firewalld:
    zone: "{{ item.zone | default(omit) }}"
    port: "{{ item.port | default(omit) }}"
    source: "{{ item.source | default(omit) }}"
    protocol: "{{ item.protocol | default(omit) }}"
    permanent: "{{ item.permanent | default(true) }}"
    state: "{{ item.state | default('enabled') }}"
    immediate: "{{ item.immediate | default(true) }}"
  loop: "{{ firewall_rules }}"
  when: firewall_rules is defined and firewall_rules | length > 0
  tags:
    - custom_firewalld


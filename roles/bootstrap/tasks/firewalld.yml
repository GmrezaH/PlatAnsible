- name: Firewalld | Kubernetes nodes trusted sources (kube-public)
  ansible.posix.firewalld:
    zone: "trusted"
    source: "{{ hostvars[item].ip}}/32"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ groups['kube_node'] + groups['kube_control_plane'] }}"
  when: inventory_hostname in (groups ["kube_node"] + groups ["kube_control_plane"] )
  tags:
    - kube_firewalld

- name: Firewalld | Kubernetes nodes trusted sources (kube-private)
  ansible.posix.firewalld:
    zone: "trusted"
    source: "{{ hostvars[item].ippv}}/32"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ groups['kube_node'] + groups['kube_control_plane'] }}"
  when: inventory_hostname in (groups ["kube_node"] + groups ["kube_control_plane"] )
  tags:
    - kube_firewalld

- name: Firewalld | Kubernetes nodes trusted sources (Kubernetes networks subnets)
  ansible.posix.firewalld:
    zone: "trusted"
    source: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ kube_network_subnets }}"
  when: inventory_hostname in (groups ["kube_node"] + groups ["kube_control_plane"] )
  tags:
    - kube_firewalld

- name: Firewalld | Elasticsearch nodes trusted sources
  ansible.posix.firewalld:
    zone: "trusted"
    source: "{{ hostvars[item].ansible_host}}/32"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ groups['es_node'] }}"
  when: inventory_hostname in groups ["es_node"]
  tags:
    - es_firewalld

- name: Firewalld | Restart firewalld
  ansible.builtin.service:
    name: firewalld
    state: restarted

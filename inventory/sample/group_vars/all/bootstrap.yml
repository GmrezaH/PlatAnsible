# OS tuning parameters
sysctl:
  - name: "vm.max_map_count"
    value: "262144"

# Security Limits
limits: 
  nofile:
    soft: 65536
    hard: 1048576
  nproc:
    soft: 65536
    hard: 65536

# Load or unload kernel modules
# kernel_modules:
#   - name: ceph
#     # "present" (default), "absent"
#     state: present
#     params: ""
#     # "present", "absent", "disabled" (default)
#     persistent: present
#   - name: libceph
#     state: present
#     params: ""
#     persistent: present

# YUM repository configuration
yum_repositories:
  - name: appstream
    mirrorlist: https://mirrors.rockylinux.org/mirrorlist?arch=$basearch&repo=AppStream-$releasever
    #baseurl: https://dl.rockylinux.org/$contentdir/$releasever/AppStream/$basearch/os/
  - name: baseos
    mirrorlist: https://mirrors.rockylinux.org/mirrorlist?arch=$basearch&repo=BaseOS-$releasever
    #baseurl: https://dl.rockylinux.org/$contentdir/$releasever/BaseOS/$basearch/os/
  - name: epel
    metalink: https://mirrors.fedoraproject.org/metalink?repo=epel-9&arch=$basearch
    #baseurl: http://10.19.161.33:8081/repository/EPEL-9-Everything-x86_64/
  - name: CRB
    mirrorlist: https://mirrors.rockylinux.org/mirrorlist?arch=$basearch&repo=CRB-$releasever
  - name: docker-ce-stable
    baseurl: https://download.docker.com/linux/centos/9/$basearch/stable

# Pypi repository configuration
pypi_repository:
  index_url: https://repo.example.com/repository/pypi/simple
  trusted_host: repo.example.com

# Required OS packages to be installed 
os_packages:
  - vim
  - git
  - bash-completion
  - lynis
  - net-tools
  - htop
  - sysstat
  - fio
  - lvm2
  - python3-pip
  - python3.12
  - python3.12-pip
  - tmux
  - lsof
  - telnet
  - zabbix-agent2

# Required Python packages to be installed 
pypi_packages:
  - PyYAML>=5.3.1
  - docker
  - docker-compose

# System upgrade configuration
system_upgrade: true
## Can be: on-upgrade, always, never
system_upgrade_reboot: never

# Zabbix agent2 configuration
zabbix:
  servers:
    - 192.168.10.101
    - 192.168.10.102
  active_checks: true

# Systemd services to be enabled and started
enable_services:
  - chronyd
  - sshd
  - firewalld
  - zabbix-agent2

# Firewalld rules
ssh_server_ports: ["2222"]
kube_network_subnets:
  - "11.233.0.0/18"
  - "11.233.64.0/18"
[ssh_connection]
pipelining=True
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ConnectionAttempts=100 -o UserKnownHostsFile=/dev/null
#control_path = ~/.ssh/ansible-%%r@%%h:%%p
[defaults]
# https://github.com/ansible/ansible/issues/56930 (to ignore group names with - and .)
force_valid_group_names = ignore
# vault_password_file = 
private_key_file = /root/.ssh/infra_key
host_key_checking=False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp
fact_caching_timeout = 86400
timeout = 300
stdout_callback = default
display_skipped_hosts = no
library = ./library
roles_path = roles:../roles:$VIRTUAL_ENV/usr/local/share/ansible/roles
inventory = inventory/cloud/inventory.ini
deprecation_warnings=False
inventory_ignore_extensions = ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo, .creds, .gpg
#strategy_plugins = mitogen/ansible_mitogen/plugins/strategy
#strategy = mitogen_linear
callbacks_enabled = timer, profile_tasks, profile_roles, ara_default
forks = 20
[inventory]
ignore_patterns = artifacts, credentials
